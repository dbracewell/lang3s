name: Bug report
description: Report a reproducible bug or regression
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please include enough detail for us to reproduce quickly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, commands, input files, and URLs.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      description: Include stack traces, screenshots, and relevant logs.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit / branch / version
      placeholder: e.g. main@abc123

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - frontend
        - backend
        - docker/infra
        - docs
        - other

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed/redacted secrets from logs and screenshots.
          required: true
