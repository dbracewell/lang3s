services:
  inngest:
    image: inngest/inngest
    command: "inngest dev -u http://host.docker.internal:3001/api/inngest"
    ports:
      - "8288:8288"
      - "8289:8289"
    environment:
      # - INNGEST_EVENT_KEY=AF10 # Must be hex string with even number of chars
      # - INNGEST_SIGNING_KEY=AF10 # Must be hex string with even number of chars
      - INGEST_DEV=1
      - INNGEST_POSTGRES_URI=postgres://inngest:${POSTGRES_PASSWORD}@database:5432/inngest
      - INNGEST_REDIS_URI=redis://redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lang3s-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8288/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  database:
    build:
      context: .
      dockerfile: postgres/Dockerfile
      args:
        POSTGRESQL_VERSION: 17
        PGROONGA_VERSION: 4.0.4-1
    container_name: lang3s_database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lang3s
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lang3s-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inngest -d inngest"]
      interval: 5s
      timeout: 5s
      retries: 5         
        
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lang3s-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    
      #  setup:
      #    image: mongo:4.2.8
      #    depends_on:
      #      - db
      #    restart: "no"
      #    entrypoint: [ "bash", "-c", "sleep 10 && mongo --host mongo:27017 --eval 'rs.initiate()'"]
      
volumes:
  postgres_data:
  redis_data:

networks:
  lang3s-network:
    driver: bridge
