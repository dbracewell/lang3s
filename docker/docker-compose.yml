name: lang3s

services:
  inngest:
    image: inngest/inngest
    container_name: lang3s_inngest
    entrypoint: >
      /bin/sh -c "
      if [ -f /run/secrets/inngest_db_password ]; then
        export INNGEST_POSTGRES_URI=\"postgres://inngest:\$(cat /run/secrets/inngest_db_password | tr -d '\r\n')@lang3s_database:5432/inngest\";
      else
        echo 'Error: inngest_db_password secret file missing!';
        exit 1;
      fi;
      exec inngest start -u http://host.docker.internal:3000/api/inngest --signing-key A1B2C3 --event-key A1B2C3
      "
    ports:
      - "8288:8288"
      - "8289:8289"
    secrets:
      - inngest_db_password
    environment:
      - INNGEST_REDIS_URI=redis://redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lang3s-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8288/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  database:
    command: postgres -c maintenance_work_mem=1GB -c max_wal_size=10GB
    build:
      context: .
      dockerfile: postgres/Dockerfile
      secrets:
        - db_password
        - inngest_db_password
      args:
        POSTGRESQL_VERSION: 17
        PGROONGA_VERSION: 4.0.4-1
        POSTGRES_DB: lang3s
        POSTGRES_USER: admin
    shm_size: '4gb'
    container_name: lang3s_database
    restart: unless-stopped
    secrets:
      - db_password
      - inngest_db_password
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_DB=lang3s
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/postgres-init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lang3s-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5432 -U admin -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 45s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lang3s-network
    container_name: lang3s_redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  db_init:
    image: lang3s-python-core:latest
    container_name: lang3s_db_init
    restart: "no"
    working_dir: /app/backend/packages/data
    command: ["python", "init_db.py"]
    environment:
      - POSTGRES_HOST=lang3s_database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - source: db_password
        target: POSTGRES_PASSWORD
    networks:
      - lang3s-network
    profiles:
      - production


  filestore_seeder:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data
    volumes:
      - internal_filestore:/filestore
    profiles:
      - production

  lora_llm:
    image: lang3s-python-core:latest
    container_name: lang3s_lora_llm
    gpus: all
    volumes:
      - internal_filestore:/filestore
    command: ["python", "-m", "lang3s.services.apps.llm"]
    depends_on:
      filestore_seeder:
        condition: service_completed_successfully
      nlp:
        condition: service_started
    profiles:
      - production
  
  nlp:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: lang3s-python-core:latest
    container_name: lang3s_nlp
    gpus: all
    restart: unless-stopped
    command: ["python", "-m", "lang3s.services.apps.nlp", "--num_workers", "3", "--batch_size", "100"]
    environment:
      - FILESTORE_ROOT=/filestore
      - EMBEDDING_MODEL=/filestore/models/embedding
      - POSTGRES_HOST=lang3s_database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - REDIS_HOST=lang3s_redis
      - REDIS_PORT=6379
    volumes:
      - internal_filestore:/filestore
    depends_on:
      filestore_seeder:
        condition: service_completed_successfully
      db_init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: system_api_key
        target: SYSTEM_KEY
      - source: db_password
        target: POSTGRES_PASSWORD
    networks:
      - lang3s-network
    profiles:
      - production

  analytics:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: lang3s-python-core:latest
    container_name: lang3s_analytics
    restart: unless-stopped
    command: ["python", "-m", "lang3s.services.apps.analytics"]
    environment:
      - FILESTORE_ROOT=/filestore
      - EMBEDDING_MODEL=/filestore/models/embedding
      - POSTGRES_HOST=lang3s_database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - REDIS_HOST=lang3s_redis
      - REDIS_PORT=6379
    volumes:
      - internal_filestore:/filestore
    depends_on:
      filestore_seeder:
        condition: service_completed_successfully
      db_init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: system_api_key
        target: SYSTEM_KEY
      - source: db_password
        target: POSTGRES_PASSWORD
    networks:
      - lang3s-network
    profiles:
      - production

  topic:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: lang3s-python-core:latest
    container_name: lang3s_topic
    gpus: all
    restart: unless-stopped
    command: ["python", "-m", "lang3s.services.apps.topic"]
    environment:
      - FILESTORE_ROOT=/filestore
      - EMBEDDING_MODEL=/filestore/models/embedding
      - POSTGRES_HOST=lang3s_database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - REDIS_HOST=lang3s_redis
      - REDIS_PORT=6379
    volumes:
      - internal_filestore:/filestore
    depends_on:
      filestore_seeder:
        condition: service_completed_successfully
      db_init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: system_api_key
        target: SYSTEM_KEY
      - source: db_password
        target: POSTGRES_PASSWORD
    networks:
      - lang3s-network
    profiles:
      - production

  claims:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: lang3s-python-core:latest
    container_name: lang3s_claims
    gpus: all
    restart: unless-stopped
    command: ["python", "-m", "lang3s.services.apps.claims", "--num_workers", "4"]
    environment:
      - FILESTORE_ROOT=/filestore
      - EMBEDDING_MODEL=/filestore/models/embedding
      - POSTGRES_HOST=lang3s_database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - REDIS_HOST=lang3s_redis
      - REDIS_PORT=6379
    volumes:
      - internal_filestore:/filestore
    depends_on:
      filestore_seeder:
        condition: service_completed_successfully
      db_init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: system_api_key
        target: SYSTEM_KEY
      - source: db_password
        target: POSTGRES_PASSWORD
    networks:
      - lang3s-network
    profiles:
      - production

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: lang3s-python-core:latest
    container_name: lang3s_api
    gpus: all
    restart: unless-stopped
    environment:
      - FILESTORE_ROOT=/filestore
      - EMBEDDING_MODEL=/filestore/models/embedding
      - POSTGRES_HOST=lang3s_database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - REDIS_HOST=lang3s_redis
      - REDIS_PORT=6379
    volumes:
      - internal_filestore:/filestore
    command: ["python", "-m", "lang3s.services.apps.main"]
    depends_on:
      filestore_seeder:
        condition: service_completed_successfully
      db_init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: system_api_key
        target: SYSTEM_KEY
      - source: db_password
        target: POSTGRES_PASSWORD
    networks:
      - lang3s-network
    profiles:
      - production

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        INNGEST_URL: http://lang3s_inngest:8288
        INNGEST_SIGNING_KEY: A1B2C3
        REDIS_HOST: lang3s_redis
        REDIS_PORT: 6379
        REDIS_DB: 0
        BETTER_AUTH_URL: http://localhost:3000
        DATABASE_URL: /frontend_data/users.db
        FILESTORE_ROOT: /filestore
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_BACKEND_URL: http://lang3s_caddy.localhost:8003
    container_name: lang3s_frontend
    restart: unless-stopped
    command: >
      /bin/sh -c "
      if [ -f /run/secrets/system_api_key ]; then
        export SYSTEM_KEY=\"$(cat /run/secrets/system_api_key | tr -d '\n')\";
      else
        echo 'Error: system_api_key secret file missing!';
        exit 1;
      fi;
      if [ -f /run/secrets/admin_passphrase ]; then
        export ADMIN_PASSPHRASE=\"$(cat /run/secrets/admin_passphrase | tr -d '\n')\";
      else
        echo 'Error: admin_passphrase secret file missing!';
        exit 1;
      fi;
      if [ -f /run/secrets/better_auth_secret ]; then
        export BETTER_AUTH_SECRET=\"$(cat /run/secrets/better_auth_secret | tr -d '\n')\";
      else
        echo 'Error: better_auth_secret secret file missing!';
        exit 1;
      fi;
      mkdir -p /frontend_data;
      pnpm auth:bootstrap-db;
      exec pnpm start -p 3000
      "
    environment:
      - NODE_ENV=production
      - INNGEST_URL=http://lang3s_inngest:8288
      - INNGEST_SIGNING_KEY=A1B2C3
      - REDIS_HOST=lang3s_redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - NEXT_PUBLIC_BACKEND_URL=http://lang3s_caddy.localhost:8003
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:3000
      - DATABASE_URL=/frontend_data/users.db
      - FILESTORE_ROOT=/filestore
    volumes:
      - internal_filestore:/filestore
      - frontend_data:/frontend_data
    ports:
      - "3000:3000"
    secrets:
      - system_api_key
      - admin_passphrase
      - better_auth_secret
    depends_on:
      caddy:
        condition: service_started
      redis:
        condition: service_healthy
      inngest:
        condition: service_started
    networks:
      - lang3s-network
    profiles:
      - production

  caddy:
    image: caddy:latest
    restart: unless-stopped
    container_name: lang3s_caddy
    depends_on:
      api:
        condition: service_started
      analytics:
        condition: service_started
      lora_llm:
        condition: service_started
    networks:
      lang3s-network:
        aliases:
          - lang3s_caddy.localhost
    ports:
      - "80:8003"
      - "8003:8003"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    profiles:
      - production


secrets:
  db_password:
    file: secrets/db_password.txt
  inngest_db_password:
    file: secrets/inngest_db_password.txt
  admin_passphrase:
    file: secrets/admin_passphrase.txt
  system_api_key:
    file: secrets/system_api_key.txt
  better_auth_secret:
    file: secrets/better_auth_secret.txt

volumes:
  internal_filestore:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  frontend_data:

networks:
  lang3s-network:
    driver: bridge
