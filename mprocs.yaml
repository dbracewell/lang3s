procs:
  caddy:
    shell: "caddy run --config ./Caddyfile"
    autostart: true
    autorestart: true

  lora-llm:
    cwd: "backend/"
    shell: "uv  run --package lang3s-services python -m lang3s.services.apps.llm"
    autostart: true
    autorestart: true

  nlp-server:
    cwd: "backend/"
    shell: "uv run --package lang3s-services  python -m lang3s.services.apps.nlp --num_workers 3 --batch_size 100"
    autostart: true
    autorestart: true

  topic-server:
    cwd: "backend/"
    shell: "uv run --package lang3s-services  python -m lang3s.services.apps.topic"
    autostart: true
    autorestart: true

  claim-server:
    cwd: "backend/"
    shell: "uv run --package lang3s-services  python -m lang3s.services.apps.claims --num_workers 4"
    autostart: true
    autorestart: true

  analytics-server:
    cwd: "backend/"
    shell: "uv  run  --package lang3s-services python -m lang3s.services.apps.analytics"
    autostart: true
    autorestart: true

  main-api-server:
    cwd: "backend/"
    shell: "uv run --package lang3s-services python -m lang3s.services.apps.main"
    autostart: true
    autorestart: true


  nextjs-server:
    shell: "pnpm dev"
    cwd: "./frontend/lang3s"
    autostart: true
    autorestart: true