procs:
  caddy:
    shell: "caddy run --config ./Caddyfile"
    autostart: true

  python-server:
    shell: "uv --project backend/nlp/ run python backend/run.py --num_workers 3 --batch_size 500"
    autostart: true

  nextjs-server:
    shell: "pnpm dev"
    cwd: "./frontend/lang3s"
    autostart: true