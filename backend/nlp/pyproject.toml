[project]
name = "lang3s"
version = "2025.10.3"
description = "Lang3s"
authors = [
    { name = "David Bracewell" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "transformers==4.51.3",
    "torch==2.8.0",
    "torchvision==0.23",
    "datasets",
    "scikit-learn",
    "evaluate",
    "seqeval",
    "accelerate",
    "shortuuid==1.0.13",
    "lingua_language_detector==2.1.1",
    "pgvector==0.4.1",
    "inngest==0.5.9",
    "fastapi",
    "spacy_download==1.1.0",
    "uvicorn",
    "redis==7.0.0",
    "lang3s-job-service",
    "jsonlines>=4.0.0,<5.0.0",
    "hnswlib>=0.8.0,<0.9.0",
    "psycopg[binary,pgvector]>=3.2.12,<4.0.0",
    "psycopg-pool>=3.2.7,<4.0.0",
    "fastcoref>=2.1.6,<3.0.0",
    "openai>=2.7.2,<3.0.0",
    "more-itertools>=10.8.0,<11.0.0",
    "numpy<2",
    "beautifulsoup4>=4.14.2,<5.0.0",
    "markdown>=3.10,<4.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "requests>=2.32.5,<3.0.0",
    "pydantic==2.11.4",
    "pydantic-core==2.33.2",
    "sentencepiece>=0.2.1,<0.3.0",
    "python-multipart>=0.0.21,<0.1.0",
    "matplotlib>=3.10.8,<4.0.0",
    "emoji>=2.15.0,<3.0.0",
    "umap-learn>=0.5.11,<0.6.0",
    "url-normalize>=2.2.1,<3.0.0",
    "spacy>=3.8.11,<4.0.0",
    "pandas>=2.3.3,<3.0.0",
    "tables>=3.10.2,<4.0.0",
    "nltk>=3.9.2,<4.0.0",
    "duckdb>=1.4.3,<2.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "sentence-transformers>=5.2.2,<6.0.0",
    "joblib>=1.5.3,<2.0.0",
    "rapidfuzz>=3.14.3,<4.0.0",
    "gliner>=0.2.25,<0.3.0",
    "peft>=0.18.1,<0.19.0",
    "lxml>=6.0.2",
    "llama-cpp-python[server]>=0.3.17",
    "instructor>=1.14.5",
    "pip>=26.0.1",
]

[project.optional-dependencies]
train = [
    "unsloth",
    "torch",
    "bitsandbytes",
    "xformers", # Only for the 3090
    "trl>=0.18.2",
    "unsloth_zoo"
]

[tool.uv.sources]
# uv handles local editable workspaces here rather than inline with dependencies
lang3s-job-service = { path = "../jobs_service", editable = true }
unsloth = { git = "https://github.com/unslothai/unsloth.git" }
unsloth_zoo = { git = "https://github.com/unslothai/unsloth-zoo.git" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.3"
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lang3s"]
artifacts = [
    "**/*.so",
    "**/*.pyd",
    "**/*.dll"
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F401"]
fixable = ["ALL"]
