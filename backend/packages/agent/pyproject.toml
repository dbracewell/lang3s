[project]
name = "lang3s-agent"
version = "0.1.0"
description = "Lang3s Agent Packages"
authors = [
    { name = "David Bracewell" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=2.42.0",
    "pydantic>=2.13.4",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lang3s"]
