[project]
name = "lang3s-ml"
version = "0.1.0"
description = "Lang3s NLP Packages"
authors = [
    { name = "David Bracewell" }
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lang3s-data",
    "umap-learn>=0.5.11,<0.6.0",
    "transformers==4.51.3",
    "torch==2.8.0",
    "torchvision==0.23",
    "hnswlib>=0.8.0",
    "joblib>=1.5.3",
    "scikit-learn>=1.9.0",
    "numpy>=2.4.6",
    "torchcrf>=1.1.0",
    "scipy>=1.17.1",
]

[tool.uv.sources]
lang3s-data = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lang3s"]
dev-mode-dirs = ["src"]