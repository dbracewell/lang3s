[project]
name = "lang3s-core"
version = "0.1.0"
description = "Lang3s Core Packages"
authors = [
    { name = "David Bracewell" }
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jsonlines>=4.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "url-normalize>=3.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lang3s"]
dev-mode-dirs = ["src"]
