[project]
name = "lang3s-llm"
version = "0.1.0"
description = "Lang3s LLM Packages"
authors = [
    { name = "David Bracewell" }
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lang3s-core",
    "openai>=2.42.0",
    "pydantic>=2.13.4",
]

[tool.uv.sources]
lang3s-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lang3s"]
dev-mode-dirs = ["src"]