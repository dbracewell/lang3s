[project]
name = "lang3s-nlp"
version = "0.1.0"
description = "Lang3s NLP Packages"
authors = [
    { name = "David Bracewell" }
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lang3s-data",
    "lang3s-core",
    "lang3s-ml",
    "lang3s-llm",
    "lang3s-agent",
    "spacy>=3.8.14",
    "spacy-download>=1.1.0",
    "click>=8.4.1",
    "jsonlines>=4.0.0",
    "shortuuid>=1.0.13",
    "lingua-language-detector>=2.1.1",
    "more-itertools>=11.1.0",
    "gliner>=0.2.26",
    "seqeval>=1.2.2",
    "torch>=2.8.0",
    "pydantic>=2.13.4",
    "transformers>=4.51.3",
    "scikit-learn>=1.9.0",
    "numpy>=2.4.6",
    "tqdm>=4.68.2",
    "joblib>=1.5.3",
    "hnswlib>=0.8.0",
    "sqlalchemy>=2.0.50",
    "rapidfuzz>=3.14.5",
    "python-dateutil>=2.9.0.post0",
]

[tool.uv.sources]
lang3s-core = { workspace = true }
lang3s-data = { workspace = true }
lang3s-ml = { workspace = true }
lang3s-llm = { workspace = true }
lang3s-agent = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lang3s"]
dev-mode-dirs = ["src"]